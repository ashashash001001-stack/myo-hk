<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My O! 結婚證書套宣傳單張</title>
    <meta name="robots" content="index, follow">
    <link rel="icon" href="image/01_company_logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* 匯入高級字體 */
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Montserrat:wght@300;400&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

        /* 打印優化 - A5 尺寸 */
        @page {
            size: 148mm 210mm;
            margin: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #D8D4CB;
            margin: 0;
            padding: 20px;
        }

        /* A5 尺寸比例容器 - 畫廊風格 */
        .a5-flyer {
            width: 420px;
            min-height: 594px;
            background-color: #FAF8F3;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            page-break-after: always;
        }

        /* 雜誌級邊框系統 (Passepartout) */
        .frame-outer {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 0.5px solid rgba(180, 170, 155, 0.4);
            pointer-events: none;
        }

        .frame-inner {
            position: absolute;
            top: 18px;
            left: 18px;
            right: 18px;
            bottom: 18px;
            border: 0.3px solid rgba(180, 170, 155, 0.25);
            pointer-events: none;
        }

        /* 品牌區域 - 不置中設計 */
        .brand-section {
            padding: 20px 20px 0;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            margin-bottom: 0;
        }

        .brand-logo img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 0.8px solid rgba(180, 150, 100, 0.5);
        }

        .brand {
            font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 8px;
            color: #4A4540;
            margin-bottom: 2px;
        }

        .brand-sub {
            font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 3px;
            color: #9A9388;
            margin-top: 2px;
        }
            text-transform: uppercase;
        }

        /* 右側裝飾線 */
        .brand-decoration {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .brand-line {
            width: 40px;
            height: 0.3px;
            background: rgba(180, 150, 100, 0.4);
        }

        /* 主視覺區 - 不對稱網格 */
        .hero-section {
            padding: 12px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 6px;
        }

        .hero-image-main {
            grid-column: span 2;
            height: 80px;
            background-color: #F2EEE8;
            border: 0.3px solid rgba(180, 170, 155, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero-image-main img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #fff;
        }

        /* 兩色並排 - 放大 */
        .hero-image-half {
            height: 95px;
            background-color: #F2EEE8;
            border: 0.3px solid rgba(180, 170, 155, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero-image-half img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #fff;
        }

        .hero-image-small {
            height: 30px;
            background-color: #F2EEE8;
            border: 0.3px solid rgba(180, 170, 155, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero-image-small img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #fff;
        }

        /* 標題區 - 散文式排版 */
        .title-section {
            padding: 0 20px;
            text-align: justify;
        }

        .title {
            font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
            font-size: 13px;
            font-weight: 300;
            color: #4A4540;
            line-height: 2;
            letter-spacing: 2px;
            text-align: justify;
            margin-bottom: 10px;
        }

        
        /* 裝飾分隔線 */
        .divider {
            padding: 0 20px;
            margin-bottom: 10px;
        }

        .divider-line {
            width: 100%;
            height: 0.3px;
            background: linear-gradient(90deg, transparent, rgba(180, 150, 100, 0.3), transparent);
        }

        /* 產品展示 - 畫廊網格 */
        .product-section {
            padding: 0 20px;
            margin-bottom: 10px;
        }

        .product-label-small {
            font-family: 'Montserrat', sans-serif;
            font-size: 6px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #A09888;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .product-item {
            background: #fff;
            border: 0.3px solid rgba(180, 170, 155, 0.15);
            padding: 3px;
            text-align: center;
        }

        .product-item img {
            width: 100%;
            height: 24px;
            object-fit: contain;
        }

        .product-label {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 6px;
            color: #8A8578;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* 顏色選項 - 水平排列 */
        .color-section {
            padding: 0 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 0.3px solid rgba(180, 170, 155, 0.3);
        }

        .color-text {
            font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
            font-size: 7px;
            font-weight: 300;
            color: #7A7568;
            letter-spacing: 1px;
        }

        /* 產品特色 - 帶分隔線 */
        .features-section {
            padding: 0 20px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            border-top: 0.3px solid rgba(180,170,155,0.1);
            border-bottom: 0.3px solid rgba(180,170,155,0.1);
        }

        .feature-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px 0;
            gap: 2px;
            position: relative;
        }

        .feature-item:not(:last-child)::after {
            content: "";
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 70%;
            width: 0.3px;
            background: rgba(180,170,155,0.15);
        }

        .feature-icon {
            font-size: 9px;
        }

        .feature-text {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 5.5px;
            color: #6B6661;
            letter-spacing: 0.5px;
        }

        /* 更多資訊 */
        .more-info {
            padding: 0 20px;
            margin-bottom: 8px;
            text-align: center;
        }

        .info-text {
            font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
            font-size: 6px;
            font-weight: 300;
            color: #A09888;
            letter-spacing: 2px;
        }

        /* 更多產品詳情 - 表格樣式 */
        .product-details {
            padding: 0 20px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            background: linear-gradient(180deg, transparent 0%, rgba(180,170,155,0.05) 50%, transparent 100%);
            border-top: 0.3px solid rgba(180,170,155,0.15);
            border-bottom: 0.3px solid rgba(180,170,155,0.15);
        }

        .detail-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 0;
            position: relative;
        }

        .detail-item:not(:last-child)::after {
            content: "";
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 0.5px;
            height: 60%;
            background: rgba(180,170,155,0.2);
        }

        .detail-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 5px;
            font-weight: 400;
            color: #9A9388;
            letter-spacing: 2px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .detail-value {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 7px;
            font-weight: 500;
            color: #5A5550;
            letter-spacing: 0.5px;
        }

        /* 底部區域 - 更突出 */
        .footer-section {
            margin-top: auto;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(180,170,155,0.08) 0%, transparent 100%);
            border-top: 0.5px solid rgba(180, 170, 155, 0.3);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contact-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 6px;
            font-weight: 400;
            letter-spacing: 3px;
            color: #A09888;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .contact-item {
            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-item.ig {
            color: #E1306C;
        }

        .contact-item.wa {
            color: #25D366;
        }

        .contact-item i {
            font-size: 14px;
        }

        .contact-item span {
            font-size: 9px;
            color: #5A5550;
        }

        /* QR Code - 油墨沉積感 */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .qr-code {
            width: 45px;
            height: 45px;
            background-color: #FAF8F3;
            border: 0.3px solid rgba(180, 170, 155, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px;
            mix-blend-mode: multiply;
            opacity: 0.85;
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .qr-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 6px;
            font-weight: 300;
            letter-spacing: 1px;
            color: #9A9388;
        }

        /* 打印優化 */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .a5-flyer {
                box-shadow: none;
                width: 100%;
                height: auto;
            }
            .frame-outer, .frame-inner {
                border-color: #C0B8AC;
            }
        }

        /* 屏幕預覽 */
        @media screen {
            .a5-flyer {
                box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            }
        }
    </style>
</head>
<body>
    <div class="a5-flyer">
        <!-- 邊框裝飾 -->
        <div class="frame-outer"></div>
        <div class="frame-inner"></div>

        <!-- 品牌區域 -->
        <div class="brand-section">
            <div class="brand-left">
                <div class="brand-logo">
                    <img src="image/01_company_logo.png" alt="My O! Logo">
                </div>
                <div class="brand">My O!</div>
                <div class="brand-sub">結婚證書套</div>
            </div>
            <div class="brand-decoration">
                <div class="brand-line"></div>
                <div class="brand-line" style="width: 25px;"></div>
                <div class="brand-line" style="width: 15px;"></div>
            </div>
        </div>

        <!-- 主視覺區 -->
        <div class="hero-section">
            <div class="hero-image-half">
                <img src="image/cert_color_beige.jpg" alt="米色證書套">
            </div>
            <div class="hero-image-half">
                <img src="image/cert_color_blue.jpg" alt="藍色證書套">
            </div>
        </div>

        <!-- 標題區 - 散文式 -->
        <div class="title-section">
            <div class="title">
                為人生最重要的一頁，留下最溫柔的觸感。
            </div>
        </div>

        <!-- 分隔線 -->
        <div class="divider">
            <div class="divider-line"></div>
        </div>

        <!-- 產品展示 -->
        <div class="product-section">
            <div class="product-label-small">精選款式</div>
            <div class="product-grid">
                <div class="product-item">
                    <img src="image/cert_style_1.png" alt="款式1">
                    <div class="product-label">簡約經典</div>
                </div>
                <div class="product-item">
                    <img src="image/cert_style_2.png" alt="款式2">
                    <div class="product-label">浪漫花卉</div>
                </div>
                <div class="product-item">
                    <img src="image/cert_style_3_chinese.png" alt="款式3">
                    <div class="product-label">時尚幾何</div>
                </div>
                <div class="product-item">
                    <img src="image/cert_style_4.png" alt="款式4">
                    <div class="product-label">夢幻元素</div>
                </div>
                <div class="product-item">
                    <img src="image/cert_style_5.png" alt="款式5">
                    <div class="product-label">更多選擇</div>
                </div>
                </div>
        </div>

        <!-- 顏色選項 -->
        <div class="color-section">
            <div class="color-item">
                <div class="color-dot" style="background-color: #f6dba6;"></div>
                <span class="color-text">米色 · 亞麻布</span>
            </div>
            <div class="color-item">
                <div class="color-dot" style="background-color: #0a477e;"></div>
                <span class="color-text">藍色 · 磨砂珠光</span>
            </div>
        </div>

        <!-- 產品特色 -->
        <div class="features-section">
            <div class="feature-item">
                <i class="fas fa-ruler-horizontal feature-icon" style="color: #8B7355;"></i>
                <span class="feature-text">A4尺寸</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-sparkles feature-icon" style="color: #D4AF37;"></i>
                <span class="feature-text">燙金工藝</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-layer-group feature-icon" style="color: #7A9A7A;"></i>
                <span class="feature-text">內襯保護</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-signature feature-icon" style="color: #9A7B7B;"></i>
                <span class="feature-text">名字燙印</span>
            </div>
        </div>

        <!-- 更多資訊 -->
        <div class="more-info">
            <span class="info-text">結婚登記 · 註冊儀式 · 終身珍藏</span>
        </div>

        <!-- 更多產品詳情 -->
        <div class="product-details">
            <div class="detail-item">
                <span class="detail-label">材質</span>
                <span class="detail-value">進口棉麻 / 磨砂珠光紙</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">工藝</span>
                <span class="detail-value">熱轉印燙金</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">內頁</span>
                <span class="detail-value">絨布內襯 + 固定帶</span>
            </div>
        </div>

        <!-- 底部區域 -->
        <div class="footer-section">
            <div class="contact-info">
                <div class="contact-item ig">
                    <i class="fab fa-instagram" style="font-size: 14px; color: #E1306C;"></i>
                    <span>@myo.makeyourown</span>
                </div>
                <div class="contact-item wa">
                    <i class="fab fa-whatsapp" style="font-size: 14px; color: #25D366;"></i>
                    <span>6379 6410</span>
                </div>
            </div>
            <div class="qr-section">
                <div class="qr-code">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://myo-makeyourown.pages.dev&bgcolor=faf8f3&color=4a4540&format=png" alt="QR Code">
                </div>
                <span class="qr-text">掃碼瀏覽更多</span>
            </div>
        </div>
    </div>
</body>
</html>
