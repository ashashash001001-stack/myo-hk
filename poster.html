<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My O! 結婚證書套宣傳單張</title>
    <meta name="robots" content="index, follow">
    <link rel="icon" href="image/01_company_logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* 匯入 Google 字體：思源宋體 (標題用) 與 思源黑體 (內文用) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

        /* 打印優化 - A5 尺寸 */
        @page {
            size: 148mm 210mm;
            margin: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #E8E6E1;
            margin: 0;
            padding: 20px;
        }

        /* A5 尺寸比例容器 */
        .a5-flyer {
            width: 420px;
            min-height: 594px;
            background-color: #FAFAF7;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 35px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            page-break-after: always;
        }

        /* 裝飾邊框 */
        .a5-flyer::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid #E0DCD3;
            pointer-events: none;
        }

        /* 品牌 Logo 區域 */
        .brand {
            font-family: 'Noto Serif TC', serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 4px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #B8860B 0%, #E6C27A 50%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-sub {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 10px;
            color: #A39E93;
            letter-spacing: 2px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        /* 主視覺情境照 */
        .hero-image {
            width: 100%;
            height: 200px;
            background-color: #EFECE6;
            border: 1px solid #E0DCD3;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #fff;
        }

        /* 核心標題 */
        .title {
            font-family: 'Noto Serif TC', serif;
            font-size: 19px;
            color: #4A4643;
            text-align: center;
            line-height: 1.7;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* 產品圖片展示 */
        .product-showcase {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 25px;
        }

        .product-item {
            background: #fff;
            border: 1px solid #E8E4DB;
            padding: 5px;
            text-align: center;
        }

        .product-item img {
            width: 100%;
            height: 50px;
            object-fit: contain;
        }

        .product-label {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 9px;
            color: #8A857F;
            margin-top: 3px;
            letter-spacing: 0.5px;
        }

        .product-item.wide {
            grid-column: span 2;
        }

        .product-item.wide img {
            height: 70px;
            width: 100%;
            object-fit: contain;
            background-color: #fff;
        }

        /* 顏色選項 */
        .color-options {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 11px;
            color: #6B6661;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #D1CDC4;
        }

        /* 賣點特徵 */
        .features {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 12px;
            color: #6B6661;
            letter-spacing: 1px;
            text-align: center;
            line-height: 2.2;
        }

        .features li::before {
            content: "✦";
            color: #D4AF37;
            margin-right: 8px;
            font-size: 9px;
        }

        /* 底部 CTA 與聯絡資訊 */
        .footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 15px;
            border-top: 1px solid #EFECE6;
        }

        .cta-text {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 11px;
            color: #8A857F;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* QR Code */
        .qr-code {
            width: 70px;
            height: 70px;
            background-color: #FFFFFF;
            border: 1px solid #D1CDC4;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            padding: 3px;
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 聯絡資訊 */
        .contact-info {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 10px;
            color: #5C5855;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .contact-info .ig {
            color: #c13584;
            margin-bottom: 3px;
        }

        .contact-info .wa {
            color: #25D366;
        }

        /* 打印優化 */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .a5-flyer {
                box-shadow: none;
                width: 100%;
                height: auto;
            }
        }

        /* 屏幕預覽優化 */
        @media screen {
            .a5-flyer {
                max-width: 420px;
            }
        }
    </style>
</head>
<body>
    <div class="a5-flyer">
        <!-- 頂部：品牌 Logo -->
        <div class="brand">My O!</div>
        <div class="brand-sub">專屬結婚證書套</div>

        <!-- 中央：商品情境照 -->
        <div class="hero-image">
            <img src="image/cert_color_beige.jpg" alt="證書套實品展示" onerror="this.style.display='none'; this.parentNode.innerHTML='[ 放入高質感棉麻與燙金細節特寫圖 ]'">
        </div>

        <!-- 核心文案 -->
        <div class="title">
            為人生最重要的一頁<br>留下最溫柔的觸感
        </div>

        <!-- 產品展示 -->
        <div class="product-showcase">
            <div class="product-item">
                <img src="image/cert_style_1.png" alt="款式1">
                <div class="product-label">簡約經典</div>
            </div>
            <div class="product-item">
                <img src="image/cert_style_2.png" alt="款式2">
                <div class="product-label">浪漫花卉</div>
            </div>
            <div class="product-item">
                <img src="image/cert_style_3_chinese.png" alt="款式3">
                <div class="product-label">時尚幾何</div>
            </div>
            <div class="product-item">
                <img src="image/cert_style_4.png" alt="款式4">
                <div class="product-label">夢幻元素</div>
            </div>
            <div class="product-item wide">
                <img src="image/cert_color_beige.jpg" alt="米色證書套">
                <div class="product-label">米色 · 亞麻布紋理</div>
            </div>
            <div class="product-item wide">
                <img src="image/cert_color_blue.jpg" alt="藍色證書套">
                <div class="product-label">藍色 · 磨砂珠光</div>
            </div>
        </div>

        <!-- 顏色選項 -->
        <div class="color-options">
            <div class="color-item">
                <div class="color-dot" style="background-color: #f6dba6;"></div>
                <span>米色 · 亞麻布</span>
            </div>
            <div class="color-item">
                <div class="color-dot" style="background-color: #0a477e;"></div>
                <span>藍色 · 磨砂珠光</span>
            </div>
        </div>

        <!-- 核心賣點 -->
        <ul class="features">
            <li>純手工縫製棉麻布料</li>
            <li>客製化專屬名字燙金</li>
            <li>封存誓言的高級質感</li>
        </ul>

        <!-- 底部：行動呼籲 -->
        <div class="footer">
            <div class="cta-text">掃描預訂專屬證書套</div>
            <div class="qr-code">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://myo-makeyourown.pages.dev&bgcolor=ffffff&color=B8860B&format=png" alt="QR Code">
            </div>
            <div class="contact-info">
                <div class="ig"><i class="fab fa-instagram"></i> @myo.makeyourown</div>
                <div class="wa"><i class="fab fa-whatsapp"></i> 6379 6410</div>
            </div>
        </div>
    </div>
</body>
</html>
